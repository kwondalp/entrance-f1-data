schemaVersion: "1.0"
project:
  id: entrance-f1-data
  displayName: ENTRANCE F1 Data
role: published F1 data contract
handoffVersion: 22
currentState:
  status: rankings-candidate-contracts
  summary: "Separate hash-addressed Value and measured Power candidate contracts and schemas are prepared. Existing production datasets remain unchanged. Value retains the recovered annual USD base-salary definition; Power retains conditional driver/car measurements and withholds unsupported decompositions. Publication is not approved. See f1/rankings/README.md."
currentFocus:
  - id: focus-publish-boundary
    summary: Preserve the boundary between this validated Hungary candidate and live publication; claim Hungary production coverage only after direct endpoint verification.
  - id: focus-safe-updates
    summary: Require source verification, approved diffs, and validation before any production JSON update or promotion.
  - id: focus-historical-records-boundary
    summary: Preserve the schema-only Historical Records publication boundary until the producer supplies at least one fully eligible record and separate publication approval exists.
  - id: focus-stats-lab-publication-boundary
    summary: Preserve the historical meaning of repository-owner publication approval separately from any new merge, publication, or deployment authority; repository presence does not retroactively broaden that approval.
implemented:
  - id: rankings-producer-candidate-delivery
    summary: "Separate hash-addressed Value and measured Power candidate contracts and schemas are prepared. Existing production datasets remain unchanged. Value retains the recovered annual USD base-salary definition; Power retains conditional driver/car measurements and withholds unsupported decompositions. Publication is not approved. See f1/rankings/README.md."
  - id: current-completion-contracts-preparation
    summary: "Prepared additive verified profile and Stats completion candidates at the Italian Round 13 cutoff, preserving every existing production dataset. Manifests distinguish technical verification from candidate publication status. Web integration requires inactive-role presentation and test-expectation follow-up. No main integration or production publication is part of this preparation. See docs/current-completion-contracts.md for evidence, semantics, validation and refresh dependencies."
  - id: circuit-facts-normal-connection
    summary: "Adds the independent f1/circuits/v1 manifest, checksum-bound snapshot, schema and audit for all 23 calendar circuits. The owner requested normal website visibility after preview-only integration; 136 fields are populated and Madring's two records remain not yet established. Official-source replay and independent record references support the package. Historical exhaustive-ingestion limits remain explicit; current results, standings and canonical approval records are unchanged. See f1/circuits/v1/README.md."
  - id: italian-round-13-recovery
    summary: Adds the official 22-car Italian Round 13 classification, qualifying pole and post-race standings, reconciles the previously published Monaco prefix correction, advances the next-race pointer to Spain Round 14, and regenerates manifest-bound archive and statistics packages from the same verified cutoff without importing unrelated candidate work.
  - id: integrity-hardening-provenance-rebind
    summary: The Results Archive schema accepts valid future ISO cutoffs and requires cutoff, coverage and latest-event agreement. All affected manifests and 157 Stats Lab payloads use independently verifiable release-owned producer provenance; machine-generated JSON and schema paths are LF-pinned; every manifest entry, byte count, checksum and declared file set closes exactly; and no calculated sporting value changed.
  - id: dutch-sprint-leader-proposal
    summary: Current-season standings, results, Sprint classification, schedule state and career totals now share the Dutch Round 12 cutoff. Results Archive v2 contains 1,161 races and 26,165 classification rows; Stats Lab v1 and Stats Core are regenerated from that archive. Four complete-through-cutoff Sprint leader payloads bring the unchanged 144-route backfill to 144/0/0 while Grand Prix leader and Sprint-fastest products retain honest bounded-partial coverage.
  - id: stats-cc0-lap-position-proposal
    summary: Twenty-nine lazy payloads publish bounded Grand Prix leader and Sprint fastest-lap observations under OWNER-20260826-STATS-CC0-LAP-POSITION-03, with exact TracingInsights RaceData commit/CC0 attribution and F1DB circuit-distance support. Catalogue, inventory, coverage and manifest metadata keep four Sprint leader products unavailable under the factual missing-table blocker while preserving all prior payload bytes and every route.
  - id: stats-remaining36-proposal
    summary: Three lazy payloads add 28 Driver Grand Slam totals, 14 Constructor Grand Slam totals, and nine bounded-partial first-across-line event rows. Catalogue, inventory, coverage and manifest metadata reclassify the other exact 33 objects to factual-evidence unavailable under OWNER-20260826-STATS-REMAINING36-STATUS-02 while preserving the registry, routes, generic permission-required schema support and every prior payload byte.
  - id: stats-final17-fastest-ever-lap-proposal
    summary: Two checksum-bound complete-through-cutoff payloads add the Driver and Constructor holder of the fastest official qualifying or Grand Prix race lap by average speed under semantic approval OWNER-20260825-STATS-FASTEST-EVER-SEMANTIC-01, retaining canonical identity, event, session, Monza configuration, lap duration, distance, km/h, fixed F1DB release/licence attribution, and unchanged IDs/routes while leaving the other 15 independently assessed metrics unavailable.
  - id: stats-non-lap-backfill-proposal
    summary: The shared package adds 21 licensed partial metric payloads and explicit permission_required, unavailable, publicationStatus, source-licence, raw-field, identity-dependency and coverage metadata while preserving raw numeric values and null data paths for unresolved metrics.
  - id: stats-metric-backfill-v1-proposal
    summary: The additive versioned package provides an exact 144-metric inventory, 98 lazy payloads, 46 fail-closed blocked entries, evidence cutoffs and completeness, provenance, Draft 2020-12 schema, coverage report, and checksum manifest for shared Web and future App consumption.
  - id: malaysia-calendar-round-16-proposal
    summary: The generated 2026 schedule candidate publishes 23 consecutive rounds, adds Bahrain Grand Prix in Malaysia at Sepang as Round 16 with verified UTC session starts, retains every existing stable race key, and shifts the seven later rounds forward by one without changing results, standings, or statistics.
  - id: stats-core-v1-proposal
    summary: The additive shared Stats Core v1 candidate contains exact-ID seasons, entries, starts, wins, podiums, poles, fastest laps, points, championships, first and last appearances, status, provenance, per-field unresolved reasons, a coverage report, a versioned schema and a checksum manifest without modifying existing public URLs.
  - id: stats-lab-production-v1
    summary: The authoritative Stats Lab production channel publishes 157 independently official-reconciled metrics with chassis-identity constructor grouping, original source identities in detail evidence, corrected status semantics, exact lazy-delivery contracts, and an exhaustive 144-product evidence blocker ledger while preserving Stable Results Archive v1 byte identities.
  - id: results-archive-v2
    summary: Append-only Results Archive v2 publishes 77 seasons, 1,160 verified Grand Prix classifications and 26,143 rows through Hungary Round 11; current points, pole, grid and fastest-lap evidence bind Formula1.com and FIA sources, while non-champion historical standings remain provisional pending chassis-versus-entrant identity reconciliation.
    schemaContract: schemas/results-archive-manifest.v2.schema.json and schemas/results-archive-season.v2.schema.json
  - id: current-season-contracts
    summary: Stable static JSON contracts provide the schedule, drivers, constructors, championship standings, driver statistics, race results, current grid, and metric definitions.
    files:
      - data/schedule.json
      - data/drivers.json
      - data/constructors.json
      - data/driver-standings.json
      - data/constructor-standings.json
      - data/driver-stats.json
      - data/race-results.json
      - data/f1/current-grid.json
      - data/f1/stat-metrics.json
    schemaContract: implicit stable JSON file shapes; the repository-local Historical Records schema does not apply to these current-season contracts
  - id: current-publication
    summary: Direct endpoint verification on 2026-08-02 found 2026 race results through round 10, belgium, with updatedAt 2026-07-26T10:54:55Z; all 17 protected public contract files matched the committed Git baseline byte-for-byte.
    baseUrl: https://kwondalp.github.io/entrance-f1-data/data/
  - id: current-season-candidate
    summary: The repository candidate contains 11 race-result entries through round 11, hungary, with Formula1.com/FIA reconciled standings, driver statistics, constructor totals and race facts generated at one coherent audit boundary.
    publicationState: validated Hungary candidate; live endpoint verification pending
  - id: stats-lab-v1-candidate
    summary: The manifest-bound Stats Lab v1 package covers 77 seasons through Hungary, exposes 157 public metrics and 144 blocked catalogue entries, and passed independent official reconstruction with 2 PASS, 155 CORRECTED and 0 BLOCKED outcomes.
    path: f1/stats-lab/v1/
    schemaVersion: stats-lab.v1
    asOfRaceDate: "2026-07-26"
    officialPoleAsOfRaceDate: "2026-07-26"
    officialPoleTotals: "1160 driver attributions and 1160 constructor attributions; current 2026 distribution is Kimi Antonelli 6, George Russell 4 and Lando Norris 1"
    sourceSnapshotPath: output/canonical/full-history-canonical-verified-provisional.json
    provenance: stable producer, source-tree, canonical, application-audit, semantic-delta, and approval-record digests are recorded without machine-local paths or execution timestamps
  - id: published-historical-records-v1-schema
    summary: The Draft 2020-12 `published-historical-records.v1` schema and publication documentation define the future consumer-facing static contract; no matching dataset file exists and no Historical Records value is published.
    schemaContract: schemas/published-historical-records.v1.schema.json
    documentation: docs/PUBLISHED_HISTORICAL_RECORDS_CONTRACT.md
    producerContract: historical-records-api-contract.v1
    consumers:
      - entrance-web
      - ipgutest
  - id: results-archive-beta-v1
    summary: The separate `f1/results-archive/beta/v1/` candidate contains one checksum-bound manifest and 77 season documents covering 1950-2026, 1,159 races, and 26,094 classifications. All 76 historical seasons are provisional; 2026 contains the exact verified Round 1-10 stable-v1 package. Missing fastest laps and start attribution remain absent or null, and shared-drive classification semantics are explicit.
    schemaContract: schemas/results-archive-beta-manifest.v1.schema.json and schemas/results-archive-beta-season.v1.schema.json
    publicationState: audited unstaged Beta candidate; not committed, pushed, deployed, or promoted to stable
  - id: stats-lab-beta-v1
    summary: The separate `f1/stats-lab/beta/v1/` candidate contains one checksum-bound manifest and five derived documents. Its 301 permanent catalogue rows are 14 published, 92 provisional, 99 blocked, and 96 unsupported; supported rankings expose only all-time coverage, missing values are not zero-filled, and grouped unsupported combinations remain unavailable.
    schemaContract: schemas/stats-lab-beta-manifest.v1.schema.json and schemas/stats-lab-beta-data.v1.schema.json
    publicationState: audited unstaged Beta candidate; not committed, pushed, deployed, or promoted to stable
pending:
  - id: pending-main-integration-decision
    summary: The active Stats Lab Accuracy Goal supplies the current publication authority; complete its normal Tools, Data and Web publication sequence and production QA without inferring authority for unrelated work.
  - id: pending-endpoint-verification
    summary: After this candidate is pushed, re-read current-season, Results Archive v2 and Stats Lab endpoints before claiming Hungary coverage is live.
  - id: pending-historical-records-phase-9b
    summary: Phase 9B may add a read-only producer-to-publisher conformance review, but it must not create a dataset while the producer reports zero production-eligible Historical Records.
  - id: pending-beta-review-and-git-action
    summary: Review the two Beta contracts, provisional coverage, and exact file inventories before granting any separate staging, commit, push, publication, stable-promotion, or deployment authority.
blocked:
  - id: blocked-main-merge-deployment
    summary: Main-branch merge and deployment remain outside the granted publication-integration authority.
  - id: blocked-historical-records-publication
    summary: Historical Records publication is blocked because the producer currently has zero ready or production-eligible records; blocked records cannot appear as nulls, placeholders, or provisional values.
knownIssues:
  - id: issue-public-manifest-portability
    summary: The verified public derived artifacts already use committed UTF-8 LF bytes, while publication of the locally repaired manifest metadata remains a separate unapproved action.
  - id: issue-current-provenance
    summary: Current-season JSON files expose updatedAt but do not embed source URLs or audit identifiers, so source and approval evidence must be verified in the approved update workflow.
  - id: issue-historical-standings-identity
    summary: Official Formula1.com final tables are retained, but only champion identities are promoted; non-champion historical standings remain provisional because chassis-versus-entrant conflicts such as Lola/Larrousse, Venturi/Larrousse and MF1/Spyker require a season-aware identity ledger.
  - id: issue-no-native-validator
    summary: This repository has no validation scripts or runtime validation dependencies; validation uses the approved Historical Records schema, JSON parsing, explicit integrity checks, manifest checksums, Git diffs, and an existing reviewed validation environment.
decisions:
  - id: decision-data-only
    summary: This repository owns published static data contracts only; application and transformation code remain in their own repositories.
  - id: decision-stable-identities
    summary: Existing driver, team, constructor, race, and session identifiers and public JSON shapes are preserved unless a schema change is explicitly approved.
  - id: decision-manual-promotion
    summary: Promotion is manual and fail-closed; the official-pole production application and Belgian-cutoff publication integration used separate repository-owner authority, a tracked strict integration record, and exact WIP-only checks.
  - id: decision-post-race-two-step
    summary: Post-race work requires a no-write draft diff followed by a separately approved apply step.
  - id: decision-preview-separation
    summary: Stats Lab v1 remains separate from approved current-season data and excludes the oversized canonical snapshot from the browser-facing package.
  - id: decision-historical-records-published-shape
    summary: "`published-historical-records.v1` accepts only verified, production-eligible records under an explicitly approved publication and omits every blocked record entirely."
  - id: decision-producer-attestation-boundary
    summary: This repository validates only the consumer-safe producer contract and `all_required_gates_passed` attestation; evidence, review, builder, and canonical details remain exclusively in entrance-f1-data-tools.
  - id: decision-historical-records-versioning
    summary: API v1 evolves additively, preserves record ID meaning, allows consumers to ignore unknown records and optional fields, and requires unsupported major versions to fail closed.
interfaces:
  - id: interface-current-season
    summary: Static current-season JSON under data/ is fetched directly by ENTRANCE clients.
    consumers:
      - entrance-web
      - ipgutest
    baseUrl: https://kwondalp.github.io/entrance-f1-data/data/
  - id: interface-stats-lab-v1
    summary: f1/stats-lab/v1/manifest.json defines the production-ready package file list, checksums, schema version, stable provenance digests, unsupported metrics, and separate publication state.
    consumer: entrance-web
    publicationState: Hungary candidate validated; endpoint verification pending normal publication
  - id: interface-results-archive-v2
    summary: f1/results-archive/current/manifest.json resolves consumers to the append-only v2 archive without changing Stable v1.
    consumer: entrance-web
    publicationState: Hungary candidate validated; endpoint verification pending normal publication
  - id: interface-historical-records-v1
    summary: "`published-historical-records.v1` is the future stable static contract for entrance-web and ipgutest; Phase 9A defines only its schema and publishes no dataset."
    consumers:
      - entrance-web
      - ipgutest
    publicationState: schema ready, dataset absent
dependencies:
  - id: dependency-data-tools
    summary: entrance-f1-data-tools ingests, normalises, validates, audits, and prepares candidate packages; promotion into this repository remains manual and reviewed.
  - id: dependency-official-results
    summary: Official F1.com classifications and standings are required for post-race facts under POST_RACE_UPDATE_RULES.md.
  - id: dependency-project-control
    summary: entrance-project-control reads this repository and its handoffs but is synchronised only after a real product commit.
nextActions:
  - id: next-main-integration-decision
    summary: Complete the already-authorised Stats Lab Accuracy publication sequence and stop only for a new valid safety condition.
  - id: next-verify-public-endpoints
    summary: After publication, verify current-season, Results Archive v2, Stats Lab manifest/catalogue and representative metric/detail endpoints before reporting live Hungary coverage.
  - id: next-historical-records-conformance
    summary: Prepare Phase 9B as a no-publication producer-to-publisher conformance review; do not create a Historical Records JSON file until at least one eligible record and explicit publication approval exist.
  - id: next-sync-control-after-commit
    summary: After an explicitly approved product commit, regenerate and separately review project-control status.
forbiddenActions:
  - id: safety-no-unapproved-git-actions
    summary: Do not commit, merge, push, or deploy without explicit user approval.
  - id: safety-no-automatic-promotion
    summary: Do not automatically copy, promote, or overwrite production data from tooling output.
  - id: safety-no-schema-or-id-changes
    summary: Do not change schemas, stable IDs, race keys, or session keys without explicit approval.
  - id: safety-no-app-or-tooling-code
    summary: Do not add application, website, scraping, ingestion, transformation, or pipeline code to this repository.
  - id: safety-no-invented-data
    summary: Do not infer or manually patch statistics from memory, training data, or forbidden ingestion sources.
  - id: safety-no-sibling-writes
    summary: Do not modify sibling repositories while completing work in this repository.
  - id: safety-no-durable-git-state
    summary: Do not place HEAD, branch, upstream, working-tree state, personal paths, or secrets in handoff files.
  - id: safety-no-historical-placeholders
    summary: Do not add an empty, blocked, null, provisional, or otherwise production-looking Historical Records dataset as a placeholder.
requiredReads:
  - id: read-project-rules
    summary: Read PROJECT_RULES.md first for repository ownership and data restrictions.
  - id: read-agents
    summary: Read AGENTS.md for repository-local operating rules.
  - id: read-ai-handoff
    summary: Read AI_HANDOFF.yaml for verified current context and next actions.
  - id: read-human-handoff
    summary: Read HUMAN_HANDOFF.md when rationale, recovery, or cross-repository context is needed.
  - id: read-post-race-rules
    summary: Read POST_RACE_UPDATE_RULES.md before any post-race inspection, draft, or apply step.
  - id: read-readme-and-manifest
    summary: Read README.md and, for historical statistics work, f1/stats-lab/v1/manifest.json.
validation:
  status: passed
  commands:
    - id: validate-integrity-closure
      summary: Validate every bound schema, manifest file set, byte count, SHA-256, 144-route uniqueness and 29-event/580-lap Sprint coverage.
    - id: validate-integrity-reproducibility
      summary: Compare deterministic twin generator candidates, platform checkout modes and committed Git-blob bytes.
    - id: validate-json-parse
      summary: Parse every repository JSON file with the standard Python json module.
      command: python -c "import json, pathlib; [json.loads(path.read_text(encoding='utf-8')) for path in pathlib.Path('.').rglob('*.json')]"
    - id: validate-handoff-schema
      summary: Validate project handoffs by generating project-control status without writing it.
      command: python -X utf8 ../entrance-project-control/scripts/sync_status.py --print
    - id: validate-official-pole-publication
      summary: Independently reconcile every public Stats Lab metric and its detail evidence to Results Archive v2 official facts.
      command: python ../entrance-f1-data-tools/scripts/audit_stats_lab_official_accuracy.py ../entrance-f1-data-tools/output/stats-lab-accuracy/stats-v1 --archive-root f1/results-archive/v2 --baseline-stats-root f1/stats-lab/v1
    - id: validate-handoff-diff
      summary: Check the intended handoff diff for whitespace errors.
      command: git diff --check -- AGENTS.md AI_HANDOFF.yaml HUMAN_HANDOFF.md
    - id: validate-git-state
      summary: Inspect final branch and worktree state without staging.
      command: git status -sb
    - id: validate-historical-records-schema
      summary: Validate the Draft 2020-12 schema and synthetic in-memory eligible and rejection cases without writing a dataset.
      command: Run jsonschema validation from an existing reviewed validation environment; this data-only repository adds no runtime dependency.
    - id: validate-historical-records-compatibility
      summary: Verify additive fields and future record IDs remain v1-compatible, unknown records can be ignored, and unsupported major versions fail closed.
      command: Run the documented in-memory consumer compatibility matrix without writing production JSON.
    - id: validate-historical-records-producer-boundary
      summary: Validate a synthetic producer API payload and its consumer-safe projection into the published schema without writing a dataset.
      command: Run the in-memory historical-records-api-contract.v1 to published-historical-records.v1 conformance matrix.
  results:
    - id: result-italian-round-13-recovery
      summary: "The draft contains 13 current-season races and 286 current-season archive classification rows, with Kimi Antonelli as Italian winner, Pierre Gasly as pole sitter, Kimi Antonelli leading Drivers on 267 points and Mercedes leading Constructors on 468 points. All repository JSON parses and every Results Archive, Stats Core and Stats Lab manifest byte/SHA declaration closes against the candidate."
      status: passed
    - id: result-integrity-hardening
      summary: Results Archive non-manifest payloads, all three Stats Core calculated payloads and all backfill calculated payloads remain byte-identical to the prior release. The clean-clone replay replaces the historical CRLF-derived archive input-set fingerprint with the canonical Git-blob/LF fingerprint. Stats Lab catalogue and 157 payloads differ only in source-binding metadata after stripping provenance fields. Schema copies are byte-identical to the canonical Tools schema, and all generated candidates match the Data tree.
    - id: result-stats-cc0-lap-position-proposal
      summary: The 144-object package validates at 140 populated, 0 permission-required and 4 unavailable across 76 Driver and 68 Constructor routes. All 559 JSON files parse; all 144 manifest entries match bytes and SHA-256; two 145-file generated candidates and the applied Data tree are byte-identical; and all 111 pre-existing metric Git blobs are unchanged. Proposal files pass UTF-8 without BOM, LF/final-LF, whitespace, credential, machine-path and restricted-raw scans.
      status: passed
    - id: result-json-parse
      summary: All 410 repository JSON files parsed successfully after the Hungary, manifest-listed Results Archive v2/current pointer and Stats Lab candidate application.
      status: passed
    - id: result-current-integrity
      summary: Stable IDs, round order, official Hungary classification, FIA standings, driver-stat deltas and constructor totals through Round 11 produced zero validation errors.
      status: passed
    - id: result-manifest-integrity
      summary: All 229 Stats Lab manifest entries and all 78 Results Archive v2 season/source entries match canonical LF byte sizes and SHA-256 checksums; Stable Results Archive v1 retains both frozen hashes.
      status: passed
    - id: result-handoff-schema
      summary: AI_HANDOFF.yaml passed the project-control Draft 2020-12 schema and read-only status generation recognised it as valid.
      status: passed
    - id: result-official-pole-publication
      summary: The independent audit reconciled all 157 public metrics with 2 PASS, 155 CORRECTED and 0 BLOCKED outcomes against the pre-release baseline; official pole attribution now covers all 1,160 Grands Prix through Hungary.
      status: passed
    - id: result-file-policy
      summary: The integration changed generated current-season data, append-only Results Archive v2/current, Stats Lab v1, v2 schemas, LF policy, and required documentation/handoffs; Stable Results Archive v1 and legacy Beta paths were not changed.
      status: passed
    - id: result-diff-check
      summary: The intended handoff files passed Git whitespace validation.
      status: passed
    - id: result-historical-records-schema
      summary: The published Historical Records schema accepted a fully eligible synthetic payload and rejected empty, ineligible, unapproved, blocked, and null-placeholder payloads.
      status: passed
    - id: result-historical-records-compatibility
      summary: Additive optional fields and future record IDs passed v1 compatibility, unknown records were safely ignored, unsupported major versions failed closed, and repeated canonical serialization was byte-identical.
      status: passed
    - id: result-historical-records-production-boundary
      summary: No Historical Records dataset was generated, and existing production JSON plus the Stats Lab candidate package retained their pre-phase checksums.
      status: passed
    - id: result-historical-records-producer-boundary
      summary: A synthetic valid producer API record projected into the published schema while producer readiness and blocker fields remained excluded.
      status: passed
    - id: result-checksum-portability
      summary: The manifest changed exactly 18 checksum and size scalars, its canonical LF bytes are 7958 bytes with SHA-256 3c9a72c58b7a466d2ee20004e979e9ffaf24bf32d4ae0485434fb512aa630326, all six derived blob IDs remained unchanged, and effective attributes require text eol=lf on all 17 protected public paths.
      status: passed
    - id: result-results-archive-v1
      summary: Results Archive v1 adds a manifest, one checksum-bound 2026 season file, and two Draft 2020-12 schemas without changing existing current-season or Stats Lab contracts. The package contains 10 races and 220 classifications through Belgian Round 10; every count, path, byte size, SHA-256, identity, winner, order, and cutoff audit passed. Manifest SHA-256 is cfdce572fd6d55c4bd39cd637f2709f97383fecc70e3b07efe2da8f4fe885f49 and season SHA-256 is be7b3493e5bfc02f2599e584203f47872b8a384a3f8056af89f0783350ea895a. All 76 historical seasons remain excluded pending archive-specific official review and exact publication approval.
      status: passed
    - id: result-results-and-stats-beta
      summary: The producer audits passed directly against this repository with zero blocking errors and zero warnings. Results Archive Beta contains 77 manifest-listed checksum-valid seasons, 1,159 races, and 26,094 classifications; Stats Lab Beta contains five checksum-valid derived documents and the exact 14 published, 92 provisional, 99 blocked, and 96 unsupported status split. All repository JSON parsed, and stable Results Archive v1 plus existing current-season and Stats Lab v1 paths have no task diff.
      status: passed
    - id: result-stats-final15
      summary: The Stats metric backfill publishes 108 checksum-bound payloads, with eight new verified-configuration circuit-record metrics marked partial and two winning-age metrics complete through 2026-07-26. Coverage is 108 available, 35 permission-required, and one unavailable across 144 unchanged routes; all 98 previously populated metric payload blobs are byte-identical to the baseline, and all 113 generated package files are UTF-8 without BOM, LF-only, final-LF, and manifest-valid.
      status: passed
lastCompletedWork:
  - id: completed-italian-round-13-recovery
    summary: Prepared the exact approved Data publication set for Italian Round 13 plus the verified Monaco correction, leaving profile, catalogue and unrelated Stats work outside the recovery and preserving the prior valid metric-backfill package.
  - id: completed-integrity-hardening
    summary: Rebound generated release provenance and line-ending contracts without changing any calculated Formula 1 value, then validated complete schema, manifest, route and checksum closure.
  - id: completed-handoff-bootstrap
    summary: Repository-local AI and human handoffs and operating instructions were created and validated without modifying production JSON or sibling repositories.
  - id: completed-current-season-candidate
    summary: Current-season standings, driver statistics, constructors, and race results were reconciled through the Belgian Grand Prix while preserving prior official-result corrections.
  - id: completed-stats-lab-candidate
    summary: "Stats Lab v1 was composed through the separately authorised official-pole publication integration: the 1,156 baseline plus three Round 8-10 overlays yields 1,159 driver and constructor totals, 107 driver and 50 constructor holders, canonical historical Mercedes 154, reconciled Records Library totals and recency, unchanged circuit and season facts, and publishApproved true."
  - id: completed-belgian-official-pole-integration
    summary: The approved Belgian current-season update and official-pole publication were integrated on the WIP branch with separate main-merge and deployment prohibitions preserved.
  - id: completed-historical-records-schema
    summary: Phase 9A added the `published-historical-records.v1` Draft 2020-12 schema, publication and compatibility documentation, and handoff state without generating a dataset or changing production JSON.
  - id: completed-public-checksum-portability
    summary: Rebound the Stats Lab manifest to committed UTF-8 LF artifact bytes and added path-scoped EOL policy without changing sporting facts, the six derived artifacts, schemas, timestamps, or approval meaning.
  - id: completed-results-archive-v1
    summary: Prepared the exact twice-reproduced, audited Results Archive v1 release package as four additive public files for 2026 Rounds 1-10 while preserving every existing data file; the manifest applicationState is immutable generation-time provenance, so current Git and canonical-endpoint state must be read directly.
  - id: completed-results-archive-beta-v1
    summary: Added the separately namespaced 77-season Results Archive Beta package, schemas, and contract documentation while preserving the stable v1 package byte-for-byte and labeling historical seasons provisional.
  - id: completed-stats-lab-beta-v1
    summary: Added the separately namespaced Stats Lab Beta manifest, five derived documents, schemas, and contract documentation with explicit catalogue status, coverage, methodology, exclusion, and unsupported-range boundaries.
  - id: completed-stats-final15
    summary: Published the owner-approved final-15 Stats package update with eight honest partial circuit-record payloads, two complete winning-age payloads, portable LF bytes, unchanged IDs and routes, and fail-closed Sprint/first-across products.
notes:
  - id: note-git-facts
    summary: Git branch, HEAD, upstream, and working-tree facts must always be read directly from Git.
  - id: note-state-separation
    summary: Published public data, repository candidate data, and data-tools provisional output are distinct states and must not be described interchangeably.
